<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SAP S/4HANA Fiori Enterprise Suite — Complete ERP</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: Inter & JetBrains Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        mono: ['JetBrains Mono', 'monospace'],
                    }
                }
            }
        }
    </script>
    <style>
        :root {
            --sap-shell-bg: #0a192f;
            --sap-shell-text: #ffffff;
            --sap-accent: #0070f2;
            --sap-accent-hover: #0057c2;
            --sap-accent-light: #ebf5fe;
            --sap-bg: #f4f6f9;
            --sap-card-bg: #ffffff;
            --sap-border: #dce2ea;
            --sap-text: #182433;
        }

        [data-theme="red-gold"] {
            --sap-shell-bg: #290e13;
            --sap-shell-text: #fff9ed;
            --sap-accent: #b91c1c;
            --sap-accent-hover: #991b1b;
            --sap-accent-light: #fef2f2;
            --sap-bg: #faf8f5;
            --sap-card-bg: #ffffff;
            --sap-border: #e6dcd1;
            --sap-text: #291818;
        }

        body {
            background-color: var(--sap-bg);
            color: var(--sap-text);
            font-family: 'Inter', sans-serif;
            transition: background-color 0.2s ease;
        }

        .sap-shell {
            background-color: var(--sap-shell-bg);
            color: var(--sap-shell-text);
        }

        .sap-btn-primary {
            background-color: var(--sap-accent);
            color: #ffffff;
            transition: all 0.15s ease;
        }
        .sap-btn-primary:hover {
            background-color: var(--sap-accent-hover);
        }

        .sap-card {
            background-color: var(--sap-card-bg);
            border: 1px solid var(--sap-border);
            border-radius: 0.75rem;
            box-shadow: 0 2px 6px rgba(10, 25, 47, 0.04);
        }

        .sap-tile {
            background-color: var(--sap-card-bg);
            border: 1px solid var(--sap-border);
            border-radius: 0.75rem;
            transition: transform 0.18s ease, box-shadow 0.18s ease, border-color 0.18s ease;
        }
        .sap-tile:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 18px rgba(10, 25, 47, 0.08);
            border-color: var(--sap-accent);
        }

        .nav-item-active {
            background-color: var(--sap-accent-light);
            color: var(--sap-accent);
            border-left: 3px solid var(--sap-accent);
            font-weight: 600;
        }

        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 9999px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }

        @media print {
            body * { visibility: hidden; }
            #printable-area, #printable-area * { visibility: visible; }
            #printable-area {
                position: fixed;
                left: 0; top: 0; width: 100%;
                background: white !important;
                color: black !important;
                padding: 20px;
                z-index: 9999;
            }
        }
    </style>
</head>
<body class="min-h-screen flex flex-col overflow-x-hidden">

    <!-- TOP SAP FIORI SHELL BAR -->

                    <span class="font-semibold text-xs sm:text-sm leading-tight">S/4HANA Enterprise Suite</span>
                    <span id="header-company-name" class="text-[10px] opacity-75">Bharat Industrial & Tech Corp (1000)</span>
                </div>
            </div>
        </div>

        <!-- Center: Interactive SAP T-Code Command Bar + Cheat Sheet Trigger -->
        <div class="relative flex-1 max-w-lg mx-1 sm:mx-3 flex items-center gap-1.5">
            <div class="relative flex-1">
                <div class="flex items-center bg-white/15 border border-white/20 rounded-lg px-2.5 py-1 focus-within:bg-white focus-within:text-slate-900 transition">
                    <span class="text-[11px] font-mono font-bold opacity-75 mr-1.5 select-none">T-CODE</span>
                    <input 
                        type="text" 
                        id="tcode-input" 
                        placeholder="Type /N, VA01, CO01, QA01, LT01, CJ20N, SE38, SM21, IS01..." 
                        class="bg-transparent w-full text-xs sm:text-sm font-mono uppercase focus:outline-none placeholder:normal-case placeholder:text-white/60 focus:placeholder:text-slate-400"
                        autocomplete="off"
                    >
                    <button onclick="executeTCodeInput()" class="ml-1 px-2 py-0.5 rounded bg-white/20 hover:bg-blue-600 hover:text-white text-xs font-medium transition" title="Execute T-Code">
                        <i class="fa-solid fa-arrow-right"></i>
                    </button>
                </div>
                <!-- Autocomplete Dropdown -->
                <div id="tcode-dropdown" class="hidden absolute left-0 right-0 mt-1.5 bg-white text-slate-800 rounded-lg shadow-2xl border border-slate-200 max-h-80 overflow-y-auto z-50 text-xs"></div>
            </div>
            <button onclick="openTCodeCheatSheet()" class="hidden md:flex items-center gap-1 px-2.5 py-1.5 rounded-lg bg-white/10 hover:bg-white/20 text-[11px] font-mono font-semibold text-white transition" title="All T-Codes Directory">

        </div>

        <!-- Right: Global Search, Notification Bell, JSON Backup, Reset & Profile -->

            <button onclick="openGlobalSearch()" class="p-2 rounded-lg hover:bg-white/10 transition text-white/90 hover:text-white" title="Global ERP Search (Ctrl+K)">

            </button>

            <button onclick="openSystemNotifications()" class="relative p-2 rounded-lg hover:bg-white/10 transition text-white/90 hover:text-white" title="Live System Logs & Notifications">
                <i class="fa-solid fa-bell text-sm"></i>
                <span id="notif-badge" class="absolute top-1.5 right-1.5 w-2 h-2 rounded-full bg-emerald-400"></span>
            </button>

            <button onclick="toggleTheme()" class="p-2 rounded-lg hover:bg-white/10 transition text-white/90 hover:text-white" title="Switch Theme (Horizon / Red-Gold)">
                <i class="fa-solid fa-palette text-sm"></i>
            </button>

            <button onclick="exportFullJSONBackup()" class="hidden lg:flex items-center gap-1 px-2.5 py-1.5 rounded-lg bg-white/10 hover:bg-emerald-600/90 text-[11px] font-medium transition" title="Export Full ERP Backup (JSON)">

            <button onclick="confirmResetDemo()" class="hidden sm:flex items-center gap-1 px-2.5 py-1.5 rounded-lg bg-white/10 hover:bg-rose-600/90 text-[11px] font-medium transition" title="Reset Demo Data">

                    SAP

        </div>

        function showToast(message, type = 'success') {
            const container = document.getElementById('sap-toast-container');
            const toast = document.createElement('div');
            const styles = {
                success: 'bg-slate-900 text-white border-l-4 border-emerald-400',
                error: 'bg-rose-950 text-white border-l-4 border-rose-500',
                info: 'bg-blue-950 text-white border-l-4 border-blue-400'
            };
            const icons = {
                success: 'fa-circle-check text-emerald-400',
                error: 'fa-circle-exclamation text-rose-400',
                info: 'fa-circle-info text-blue-400'
            };

            toast.className = `pointer-events-auto ${styles[type] || styles.success} px-4 py-3 rounded-lg shadow-xl text-xs sm:text-sm flex items-start gap-3 transition-all duration-300 transform translate-y-2 opacity-0`;
            toast.innerHTML = `
                <i class="fa-solid ${icons[type] || icons.success} mt-0.5 text-base"></i>
                <div class="flex-1 leading-snug">${message}</div>
            `;
            container.appendChild(toast);
            requestAnimationFrame(() => toast.classList.remove('translate-y-2', 'opacity-0'));
            setTimeout(() => {
                toast.classList.add('opacity-0', 'translate-y-2');
                setTimeout(() => toast.remove(), 300);
            }, 4200);
        }

        // T-Code Bar Autocomplete & Execution
        const tcodeInput = document.getElementById('tcode-input');
        const tcodeDropdown = document.getElementById('tcode-dropdown');

        tcodeInput.addEventListener('focus', () => renderTCodeDropdown(tcodeInput.value));
        tcodeInput.addEventListener('input', () => renderTCodeDropdown(tcodeInput.value));
        tcodeInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                e.preventDefault();
                executeTCodeInput();
            } else if (e.key === 'Escape') {
                tcodeDropdown.classList.add('hidden');
            }
        });

        document.addEventListener('keydown', (e) => {
            if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') {
                e.preventDefault();
                openGlobalSearch();

        function renderTCodeDropdown(query) {
            const q = (query || '').trim().toUpperCase();
            const matches = TCODE_DIRECTORY.filter(item =>
                item.code.includes(q) || item.title.toUpperCase().includes(q) || item.cat.toUpperCase().includes(q)
            );
            if (!matches.length) {
                tcodeDropdown.classList.add('hidden');
                return;
            }
            tcodeDropdown.innerHTML = matches.map(item => `
                <button onclick="selectTCode('${item.code}')" class="w-full text-left px-3 py-2 hover:bg-blue-50 border-b border-slate-100 last:border-none flex items-center justify-between gap-2 transition">
                    <div>
                        <span class="font-mono font-bold text-blue-700 mr-2">${item.code}</span>
                        <span class="font-semibold text-slate-800">${item.title}</span>
                        <div class="text-[11px] text-slate-500">${item.desc}</div>
                    </div>
                    <span class="text-[10px] font-mono bg-slate-100 px-1.5 py-0.5 rounded text-slate-600">${item.cat}</span>
                </button>
            `).join('');
            tcodeDropdown.classList.remove('hidden');
        }

        function selectTCode(code) {
            tcodeInput.value = '';
            tcodeDropdown.classList.add('hidden');
            const match = TCODE_DIRECTORY.find(t => t.code === code);
            if (match) {
                navigateTo(match.module, match.code);
                showToast(`Executed ${match.code}: ${match.title}`, 'info');
            }
        }

        function executeTCodeInput() {
            const raw = tcodeInput.value.trim().toUpperCase();
            if (!raw) return;
            const cleaned = raw.startsWith('/N') && raw.length > 2 ? raw.slice(2) : raw;
            const match = TCODE_DIRECTORY.find(t => t.code === raw || t.code === cleaned || t.module === cleaned);
            tcodeDropdown.classList.add('hidden');
            tcodeInput.value = '';

            if (match) {
                navigateTo(match.module, match.code);
                showToast(`Transaction ${match.code} started.`, 'info');
            } else {
                showToast(`Transaction "${raw}" unknown. Click "T-Codes" button for all 17 commands.`, 'error');
            }
        }

            erpState.glEntries.forEach(e => {
                if (e.type === 'Revenue') revenue += (e.credit - e.debit);
                if (e.type === 'Expense') expense += (e.debit - e.credit);
                if (e.account.startsWith('120100')) receivables += (e.debit - e.credit);
                if (e.account.startsWith('200100')) payables += (e.credit - e.debit);
            });
            const stockValue = erpState.materials.reduce((sum, m) => sum + (m.price * m.stock), 0);
            const openSO = erpState.salesOrders.filter(s => s.status === 'Open').length;
            const activeProd = erpState.productionOrders.filter(p => p.status !== 'Confirmed (TECO)').length;
            const pendingQM = erpState.qualityLots.filter(q => q.decision === 'Pending Inspection').length;

            return {
                revenue,
                expense,
                netProfit: revenue - expense,
                receivables,
                payables,
                stockValue,
                openSO,
                activeProd,
                pendingQM
            };
        }

        function saveMultiItemSalesOrder() {
            const custId = document.getElementById('sd-customer').value;
            const customer = erpState.customers.find(c => c.id === custId);
            if (!customer) return;

            let subtotal = 0;
            const items = draftSOItems.map(line => {
                const mat = erpState.materials.find(m => m.code === line.code);
                const lineNet = Math.round(mat.price * line.qty * (1 - (line.discountPct || 0) / 100));
                subtotal += lineNet;
                return { code: mat.code, name: mat.name, qty: line.qty, price: mat.price, discountPct: line.discountPct || 0 };
            });

            const gstAmount = Math.round(subtotal * 0.18);
            const soNumber = `SO-${erpState.counters.so++}`;

            erpState.salesOrders.push({
                soNumber,
                date: todayISO(),
                customerId: customer.id,
                customerName: customer.name,
                region: customer.region,
                items,
                subtotal,
                gstAmount,
                totalAmount: subtotal + gstAmount,
                status: 'Open',
                invoiceNumber: null
            });

            draftSOItems = [{ code: 'FG-1001', qty: 1, discountPct: 0 }];
            saveState();
            addSystemLog('VA01-010', 'SUCCESS', `Created Sales Order ${soNumber} for ${customer.name}.`);
            showToast(`Sales Order <strong>${soNumber}</strong> created! Click Post Invoice (VF01) to bill.`, 'success');
            renderCurrentModule();
        }

        function postSalesBilling(soNumber) {
            const so = erpState.salesOrders.find(s => s.soNumber === soNumber);
            if (!so || so.status === 'Invoiced') return;

            // Validate stock for all line items
            for (const item of so.items) {
                const mat = erpState.materials.find(m => m.code === item.code);
                if (!mat || mat.stock < item.qty) {
                    showToast(`Insufficient stock for ${item.name}! Available: ${mat ? mat.stock : 0}, Needed: ${item.qty}.`, 'error');
                    return;
                }
            }

            // Deduct stock from MM
            so.items.forEach(item => {
                const mat = erpState.materials.find(m => m.code === item.code);
                mat.stock -= item.qty;
            });

            const invNo = `INV-${erpState.counters.inv++}`;
            so.status = 'Invoiced';
            so.invoiceNumber = invNo;

            // Post to FICO GL
            const glDoc = `${erpState.counters.gl++}`;
            const date = todayISO();
            erpState.glEntries.push(
                { docNo: glDoc, date, account: '120100 - Accounts Receivable', type: 'Asset', debit: so.totalAmount, credit: 0, text: `SD Billing ${invNo} (${so.customerName})` },
                { docNo: glDoc, date, account: '400100 - Domestic Sales Revenue', type: 'Revenue', debit: 0, credit: so.subtotal, text: `Sales Revenue ${invNo}` },
                { docNo: glDoc, date, account: '220500 - Output GST Payable (18%)', type: 'Liability', debit: 0, credit: so.gstAmount, text: `Output GST 18% ${invNo}` }
            );

            // Auto-log GSTN E-Invoice in PI/PO Hub
            erpState.piMessages.unshift({
                msgId: `IDOC-${77001 + erpState.piMessages.length}`,
                time: `${date} ${new Date().toTimeString().slice(0,5)}`,
                interfaceName: 'GSTN_EINVOICE_OUT',
                direction: 'Outbound',
                system: 'NIC GST Portal',
                status: '200 OK',
                payload: JSON.stringify({ docNo: invNo, customer: so.customerName, taxable: so.subtotal, gst: so.gstAmount })
            });

            saveState();
            addSystemLog('VF01-200', 'SUCCESS', `Posted Invoice ${invNo}, deducted stock & created GL ${glDoc}.`);
            showToast(`Invoice <strong>${invNo}</strong> posted! Stock deducted, FICO GL <strong>${glDoc}</strong> updated & GSTN E-Invoice synced.`, 'success');
            renderCurrentModule();
            openGSTInvoiceModal(soNumber);
        }

        function handleCreateMaterial(e) {
            e.preventDefault();
            const code = document.getElementById('mm-code').value.trim().toUpperCase();
            const type = document.getElementById('mm-type').value;
            const name = document.getElementById('mm-name').value.trim();
            const price = parseFloat(document.getElementById('mm-price').value);
            const stock = parseInt(document.getElementById('mm-stock').value);
            const reorder = parseInt(document.getElementById('mm-reorder').value);

            if (erpState.materials.some(m => m.code === code)) {
                showToast(`SKU ${code} already exists!`, 'error');
                return;
            }
            erpState.materials.push({ code, name, type, category: 'General', price, cost: price, stock, reorder, uom: 'NOS' });
            saveState();
            showToast(`Material <strong>${code}</strong> created in MM.`, 'success');
            renderCurrentModule();
        }

        function handleCreatePO(e) {
            e.preventDefault();
            const vendorName = document.getElementById('po-vendor').value;
            const materialCode = document.getElementById('po-mat').value;
            const qty = parseInt(document.getElementById('po-qty').value);
            const unitCost = parseFloat(document.getElementById('po-cost').value);
            const mat = erpState.materials.find(m => m.code === materialCode);
            if (!mat) return;

            const poNumber = `${erpState.counters.po++}`;
            erpState.purchaseOrders.push({
                poNumber,
                date: todayISO(),
                vendorName,
                materialCode: mat.code,
                materialName: mat.name,
                qty,
                unitCost,
                totalCost: qty * unitCost,
                status: 'Open PO'
            });
            saveState();
            showToast(`Purchase Order <strong>${poNumber}</strong> created.`, 'success');
            renderCurrentModule();
        }

        function postMIGO(poNumber) {
            const po = erpState.purchaseOrders.find(p => p.poNumber === poNumber);
            if (!po || po.status !== 'Open PO') return;
            const mat = erpState.materials.find(m => m.code === po.materialCode);
            if (mat) mat.stock += po.qty;
            po.status = 'Received (MIGO)';

            // FICO GL Entry
            const glDoc = `${erpState.counters.gl++}`;
            const date = todayISO();
            erpState.glEntries.push(
                { docNo: glDoc, date, account: '140100 - Raw Material Inventory', type: 'Asset', debit: po.totalCost, credit: 0, text: `MIGO GR PO ${po.poNumber}` },
                { docNo: glDoc, date, account: '200100 - Accounts Payable (Vendors)', type: 'Liability', debit: 0, credit: po.totalCost, text: `Vendor Liability PO ${po.poNumber}` }
            );

            // Auto-create Quality Inspection Lot in QM
            const lotNo = `QM-${erpState.counters.qm++}`;
            erpState.qualityLots.push({
                lotNo,
                date,
                sourceRef: `PO ${po.poNumber}`,
                materialCode: po.materialCode,
                materialName: po.materialName,
                qty: po.qty,
                score: null,
                decision: 'Pending Inspection'
            });

            saveState();
            addSystemLog('MIGO-101', 'SUCCESS', `Goods Receipt PO ${poNumber} posted; QM Lot ${lotNo} generated.`);
            showToast(`MIGO Posted! Stock +${po.qty}, FICO Doc <strong>${glDoc}</strong> & QM Lot <strong>${lotNo}</strong> created.`, 'success');
            renderCurrentModule();
        }

        function handleCreateProdOrder(e) {
            e.preventDefault();
            const bomId = document.getElementById('pp-bom').value;
            const qty = parseInt(document.getElementById('pp-qty').value);
            const bom = erpState.boms.find(b => b.bomId === bomId);
            if (!bom) return;

            const finMat = erpState.materials.find(m => m.code === bom.finishedCode);
            const totalCost = (finMat ? finMat.cost : 25000) * qty;
            const prodNo = `PROD-${erpState.counters.prod++}`;

            erpState.productionOrders.push({
                prodNo,
                date: todayISO(),
                finishedCode: bom.finishedCode,
                finishedName: bom.finishedName,
                qty,
                totalCost,
                status: 'Released'
            });
            saveState();
            showToast(`Production Order <strong>${prodNo}</strong> released. Click Confirm Yield (CO11N) to manufacture.`, 'success');
            renderCurrentModule();
        }

        function confirmProductionOrder(prodNo) {
            const po = erpState.productionOrders.find(p => p.prodNo === prodNo);
            if (!po || po.status !== 'Released') return;
            const bom = erpState.boms.find(b => b.finishedCode === po.finishedCode);
            if (!bom) return;

            // Check Raw Material Stock
            for (const comp of bom.components) {
                const rm = erpState.materials.find(m => m.code === comp.code);
                const needed = comp.qtyPerUnit * po.qty;
                if (!rm || rm.stock < needed) {
                    showToast(`Shortage of ${comp.name}! Need ${needed}, Available ${rm ? rm.stock : 0}.`, 'error');
                    return;
                }
            }

            // Deduct Raw Materials & Add Finished Goods
            bom.components.forEach(comp => {
                const rm = erpState.materials.find(m => m.code === comp.code);
                rm.stock -= (comp.qtyPerUnit * po.qty);
            });
            const fg = erpState.materials.find(m => m.code === po.finishedCode);
            if (fg) fg.stock += po.qty;

            po.status = 'Confirmed (TECO)';

            // Post Manufacturing Cost to FICO
            const glDoc = `${erpState.counters.gl++}`;
            const date = todayISO();
            erpState.glEntries.push(
                { docNo: glDoc, date, account: '140200 - Finished Goods Inventory', type: 'Asset', debit: po.totalCost, credit: 0, text: `PP Yield ${po.prodNo} (${po.finishedName})` },
                { docNo: glDoc, date, account: '500400 - Manufacturing Conversion Cost', type: 'Expense', debit: 0, credit: po.totalCost, text: `PP Settlement ${po.prodNo}` }
            );

            // Auto-create QM Inspection Lot
            const lotNo = `QM-${erpState.counters.qm++}`;
            erpState.qualityLots.push({
                lotNo,
                date,
                sourceRef: po.prodNo,
                materialCode: po.finishedCode,
                materialName: po.finishedName,
                qty: po.qty,
                score: null,
                decision: 'Pending Inspection'
            });

            saveState();
            showToast(`Production <strong>${prodNo}</strong> confirmed! Raw materials consumed, Finished Stock +${po.qty}, QM Lot <strong>${lotNo}</strong> created.`, 'success');
            renderCurrentModule();
        }

        function decideQualityLot(lotNo, accepted) {
            const lot = erpState.qualityLots.find(l => l.lotNo === lotNo);
            if (!lot) return;
            if (accepted) {
                lot.score = 99;
                lot.decision = 'Accepted (Unrestricted)';
                showToast(`Lot <strong>${lotNo}</strong> passed QA (99/100) and released to Unrestricted Stock.`, 'success');
            } else {
                lot.score = 42;
                lot.decision = 'Rejected (Blocked Stock)';
                const mat = erpState.materials.find(m => m.code === lot.materialCode);
                if (mat) mat.stock = Math.max(0, mat.stock - lot.qty);
                showToast(`Lot <strong>${lotNo}</strong> rejected! ${lot.qty} units moved to Blocked Stock.`, 'error');
            }
            saveState();
            renderCurrentModule();
        }

        function handleWarehouseTransfer(e) {
            e.preventDefault();
            const fromId = document.getElementById('wm-from').value;
            const toId = document.getElementById('wm-to').value;
            const qty = parseInt(document.getElementById('wm-qty').value);

            if (fromId === toId) {
                showToast('Source and Destination bins cannot be identical.', 'error');
                return;
            }
            const src = erpState.warehouseBins.find(b => b.binId === fromId);
            const dst = erpState.warehouseBins.find(b => b.binId === toId);
            if (!src || !dst || src.qty < qty) {
                showToast(`Insufficient quantity in bin ${fromId}.`, 'error');
                return;
            }
            src.qty -= qty;
            dst.qty += qty;
            dst.materialCode = src.materialCode;
            dst.materialName = src.materialName;

            const toNo = `TO-${erpState.counters.wm++}`;
            erpState.wmTransfers.push({ toNo, date: todayISO(), fromBin: fromId, toBin: toId, materialName: src.materialName, qty, status: 'Confirmed' });

            showToast(`Transfer Order <strong>${toNo}</strong> confirmed: moved ${qty} units from ${fromId} to ${toId}.`, 'success');

        function handleCreatePMOrder(e) {

            const serviceFee = parseFloat(document.getElementById('pm-fee').value);

            erpState.serviceOrders.push({

                issue,
                priority: 'High',
                technician: 'Siddharth Kulkarni',
                spareCode,
                spareQty: 1,
                serviceFee,
                status: 'In Progress'
            });

            showToast(`Service Order <strong>${orderNo}</strong> created.`, 'success');
            renderCurrentModule();
        }

        function completePMOrder(orderNo) {
            const wo = erpState.serviceOrders.find(w => w.orderNo === orderNo);
            if (!wo || wo.status === 'Completed') return;

            const spare = erpState.materials.find(m => m.code === wo.spareCode);
            if (spare && spare.stock >= wo.spareQty) spare.stock -= wo.spareQty;

            wo.status = 'Completed';
            const glDoc = `${erpState.counters.gl++}`;
            erpState.glEntries.push(
                { docNo: glDoc, date: todayISO(), account: '120100 - Accounts Receivable', type: 'Asset', debit: wo.serviceFee, credit: 0, text: `Service Billing ${wo.orderNo}` },

            );
            saveState();
            showToast(`Service Order <strong>${orderNo}</strong> completed! Spare deducted & FICO Doc <strong>${glDoc}</strong> posted.`, 'success');
            renderCurrentModule();
        }

        function setABAPSample(tbl) {
            document.getElementById('abap-table-select').value = tbl;
            document.getElementById('abap-editor').value = `REPORT Z_EXTRACT_${tbl}.\nTABLES: ${tbl}.\nSELECT * FROM ${tbl} INTO TABLE @DATA(lt_result).\ncl_demo_output=>display( lt_result ).`;
            executeABAPQuery();
        }

        function executeABAPQuery() {
            const tbl = document.getElementById('abap-table-select').value;
            const out = document.getElementById('abap-output');
            let rows = [];
            if (tbl === 'VBAK') rows = erpState.salesOrders.map(s => ({ VBELN: s.soNumber, ERDAT: s.date, KUNNR: s.customerName, NETWR: s.subtotal, MWSBP: s.gstAmount, STAT: s.status }));
            if (tbl === 'MARA') rows = erpState.materials.map(m => ({ MATNR: m.code, MAKTX: m.name, MTART: m.type, LABST: m.stock, VERPR: m.price }));
            if (tbl === 'BKPF') rows = erpState.glEntries.map(g => ({ BELNR: g.docNo, BUDAT: g.date, HKONT: g.account, DMBTR_DR: g.debit, DMBTR_CR: g.credit }));
            if (tbl === 'PA0001') rows = erpState.employees.map(e => ({ PERNR: e.id, ENAME: e.name, PLANS: e.role, ORGEH: e.dept, ANSAL: e.baseSalary }));

            if (!rows.length) {
                out.innerHTML = '0 records returned.';
                return;
            }
            const headers = Object.keys(rows[0]);
            out.innerHTML = `
                <div class="text-emerald-700 font-bold mb-2">✓ ABAP Syntax Check Passed (0 Errors) — ${rows.length} rows fetched from ${tbl} in 3ms</div>
                <table class="w-full text-left border-collapse bg-white">

                        <tr class="bg-slate-200 text-slate-800">${headers.map(h => `<th class="p-2 border border-slate-300">${h}</th>`).join('')}</tr>
                    </thead>
                    <tbody>
                        ${rows.map(r => `<tr>${headers.map(h => `<td class="p-2 border border-slate-200">${r[h]}</td>`).join('')}</tr>`).join('')}
                    </tbody>
                </table>
            `;
            showToast(`ABAP Report executed against table ${tbl}.`, 'success');
        }

                        <tbody class="divide-y">${erpState.industryData.retailPos.map(r => `<tr><td class="p-2.5 font-mono font-bold text-blue-700">${r.txId}</td><td class="p-2.5">${r.store}</td><td class="p-2.5">${r.items} SKUs</td><td class="p-2.5">${r.payment}</td><td class="p-2.5 font-mono text-right font-bold">${formatINR(r.amount)}</td></tr>`).join('')}</tbody>

                tabBody = `
                    <div class="flex justify-between items-center mb-3">
                        <h3 class="font-bold text-sm">IS-Healthcare Patient Billing & Clinical Management</h3>
                        <button onclick="addIndustryRecord('HEALTH')" class="sap-btn-primary px-3 py-1.5 rounded-lg text-xs font-semibold">+ Admit / Bill Patient</button>
                    </div>
                    <table class="w-full text-left text-xs border-collapse">
                        <thead><tr class="bg-slate-50 border-b"><th class="p-2.5">UHID</th><th class="p-2.5">Patient Name</th><th class="p-2.5">Department</th><th class="p-2.5 text-right">Bill Amount</th><th class="p-2.5 text-center">Status</th></tr></thead>
                        <tbody class="divide-y">${erpState.industryData.healthcarePatients.map(p => `<tr><td class="p-2.5 font-mono font-bold text-blue-700">${p.uhid}</td><td class="p-2.5 font-medium">${p.patient}</td><td class="p-2.5">${p.dept}</td><td class="p-2.5 font-mono text-right font-bold">${formatINR(p.bill)}</td><td class="p-2.5 text-center"><span class="px-2 py-0.5 rounded-full bg-emerald-100 text-emerald-800 text-[11px]">${p.status}</span></td></tr>`).join('')}</tbody>
                    </table>
                `;
            } else if (activeIndustryTab === 'BANK') {
                tabBody = `
                    <div class="flex justify-between items-center mb-3">
                        <h3 class="font-bold text-sm">IS-Banking Commercial Loans & Liquidity</h3>
                        <button onclick="addIndustryRecord('BANK')" class="sap-btn-primary px-3 py-1.5 rounded-lg text-xs font-semibold">+ Sanction Credit Line</button>
                    </div>
                    <table class="w-full text-left text-xs border-collapse">
                        <thead><tr class="bg-slate-50 border-b"><th class="p-2.5">Account No</th><th class="p-2.5">Corporate Client</th><th class="p-2.5">Facility</th><th class="p-2.5">Interest</th><th class="p-2.5 text-right">Exposure</th></tr></thead>
                        <tbody class="divide-y">${erpState.industryData.bankingAccounts.map(b => `<tr><td class="p-2.5 font-mono font-bold text-blue-700">${b.acctNo}</td><td class="p-2.5 font-medium">${b.holder}</td><td class="p-2.5">${b.type}</td><td class="p-2.5 font-mono">${b.rate}</td><td class="p-2.5 font-mono text-right font-bold">${formatINR(b.balance)}</td></tr>`).join('')}</tbody>
                    </table>
                `;
            } else {
                tabBody = `
                    <div class="flex justify-between items-center mb-3">
                        <h3 class="font-bold text-sm">IS-Utilities Smart Meter Billing & Grid Status</h3>
                        <button onclick="addIndustryRecord('UTIL')" class="sap-btn-primary px-3 py-1.5 rounded-lg text-xs font-semibold">+ Log Smart Meter Reading</button>
                    </div>
                    <table class="w-full text-left text-xs border-collapse">
                        <thead><tr class="bg-slate-50 border-b"><th class="p-2.5">Meter ID</th><th class="p-2.5">Industrial Consumer</th><th class="p-2.5 text-right">Usage (kWh)</th><th class="p-2.5 text-right">Tariff Bill</th><th class="p-2.5 text-center">Grid Status</th></tr></thead>
                        <tbody class="divide-y">${erpState.industryData.utilitiesMeters.map(u => `<tr><td class="p-2.5 font-mono font-bold text-blue-700">${u.meterNo}</td><td class="p-2.5 font-medium">${u.consumer}</td><td class="p-2.5 font-mono text-right">${u.unitsKwh.toLocaleString()}</td><td class="p-2.5 font-mono text-right font-bold">${formatINR(u.bill)}</td><td class="p-2.5 text-center"><span class="px-2 py-0.5 rounded-full bg-blue-100 text-blue-800 text-[11px]">${u.status}</span></td></tr>`).join('')}</tbody>
                    </table>
                `;
            }

            container.innerHTML = `
                <div class="sap-card p-5 space-y-4">
                    <div class="flex flex-wrap gap-2 border-b border-slate-200 pb-3">
                        ${tabs.map(t => `
                            <button onclick="activeIndustryTab='${t.key}'; renderCurrentModule();" class="px-3.5 py-2 rounded-lg text-xs font-semibold flex items-center gap-2 transition ${activeIndustryTab === t.key ? 'sap-btn-primary shadow-xs' : 'bg-slate-100 text-slate-700 hover:bg-slate-200'}">
                                <i class="fa-solid ${t.icon}"></i> ${t.label}
                            </button>
                        `).join('')}
                    </div>
                    <div class="overflow-x-auto">${tabBody}</div>
                </div>
            `;
        }

        function addIndustryRecord(type) {
            if (type === 'RETAIL') {
                erpState.industryData.retailPos.unshift({ txId: `POS-${901 + erpState.industryData.retailPos.length}`, store: 'Hyderabad HITEC City Store', items: 3, amount: 14800, payment: 'UPI / QR' });
            } else if (type === 'HEALTH') {
                erpState.industryData.healthcarePatients.unshift({ uhid: `UHID-${4401 + erpState.industryData.healthcarePatients.length}`, patient: 'Suresh Gowda', dept: 'Diagnostics', bill: 16500, status: 'Insured / Cleared' });
            } else if (type === 'BANK') {
                erpState.industryData.bankingAccounts.unshift({ acctNo: `LN-${20045110 + erpState.industryData.bankingAccounts.length}`, holder: 'Deccan Precision Tools', type: 'Equipment Loan', balance: 2800000, rate: '8.90%' });
            } else {
                erpState.industryData.utilitiesMeters.unshift({ meterNo: `MTR-KA-${7820 + erpState.industryData.utilitiesMeters.length}`, consumer: 'Whitefield Tech Park Tower 3', unitsKwh: 11200, bill: 89600, status: 'Grid Normal' });
            }
            saveState();
            showToast(`New ${type} vertical transaction posted in SAP IS01.`, 'success');
            renderCurrentModule();
        }

        /**
         * ============================================================================
         * 6. MODALS, CSV / JSON EXPORTS & GLOBAL SEARCH
         * ============================================================================
         */
        function openTCodeCheatSheet() {
            const modal = document.getElementById('sap-modal');
            const content = document.getElementById('sap-modal-content');
            content.innerHTML = `
                <div class="px-5 py-3.5 bg-slate-900 text-white flex justify-between items-center">
                    <span class="font-semibold text-sm"><i class="fa-solid fa-terminal text-blue-400 mr-2"></i>SAP S/4HANA Complete T-Code Directory</span>
                    <button onclick="closeModal()" class="p-1.5 rounded hover:bg-white/10"><i class="fa-solid fa-xmark"></i></button>
                </div>
                <div class="p-5 overflow-y-auto grid grid-cols-1 sm:grid-cols-2 gap-2.5 text-xs">
                    ${TCODE_DIRECTORY.map(t => `
                        <button onclick="closeModal(); navigateTo('${t.module}', '${t.code}');" class="p-3 rounded-lg border border-slate-200 hover:border-blue-600 hover:bg-blue-50 text-left flex justify-between items-start transition">
                            <div>
                                <div class="font-mono font-bold text-blue-700">${t.code} <span class="text-slate-800 font-sans">— ${t.title}</span></div>
                                <div class="text-slate-500 text-[11px] mt-0.5">${t.desc}</div>
                            </div>
                            <span class="text-[10px] bg-slate-100 px-1.5 py-0.5 rounded font-mono">${t.cat}</span>
                        </button>
                    `).join('')}
                </div>
            `;
            modal.classList.remove('hidden');
        }

        function openSystemNotifications() {
            const modal = document.getElementById('sap-modal');
            const content = document.getElementById('sap-modal-content');
            content.innerHTML = `
                <div class="px-5 py-3.5 bg-slate-900 text-white flex justify-between items-center">
                    <span class="font-semibold text-sm"><i class="fa-solid fa-bell text-emerald-400 mr-2"></i>SAP System & Audit Notifications</span>
                    <button onclick="closeModal()" class="p-1.5 rounded hover:bg-white/10"><i class="fa-solid fa-xmark"></i></button>
                </div>
                <div class="p-5 overflow-y-auto space-y-2 text-xs font-mono">
                    ${erpState.systemLogs.map(l => `
                        <div class="p-2.5 rounded bg-slate-50 border border-slate-200 flex gap-3">
                            <span class="text-slate-400">${l.time}</span>
                            <span class="font-bold text-blue-700">${l.code}</span>
                            <span class="text-slate-800 font-sans">${l.msg}</span>
                        </div>
                    `).join('')}
                </div>
            `;
            modal.classList.remove('hidden');
        }

        function openCompanySettingsModal() {
            const modal = document.getElementById('sap-modal');
            const content = document.getElementById('sap-modal-content');
            content.innerHTML = `
                <div class="px-5 py-3.5 bg-slate-900 text-white flex justify-between items-center">
                    <span class="font-semibold text-sm">SAP Company Code Configuration (OX02)</span>
                    <button onclick="closeModal()" class="p-1.5 rounded hover:bg-white/10"><i class="fa-solid fa-xmark"></i></button>
                </div>
                <form onsubmit="saveCompanySettings(event)" class="p-5 space-y-3 text-xs">
                    <div>
                        <label class="block font-semibold mb-1">Company Name</label>
                        <input type="text" id="cfg-name" value="${erpState.company.name}" required class="w-full px-3 py-2 border border-slate-300 rounded-lg">
                    </div>
                    <div class="grid grid-cols-2 gap-3">
                        <div>
                            <label class="block font-semibold mb-1">Company Code</label>
                            <input type="text" id="cfg-code" value="${erpState.company.code}" required class="w-full px-3 py-2 font-mono border border-slate-300 rounded-lg">
                        </div>
                        <div>
                            <label class="block font-semibold mb-1">GSTIN</label>
                            <input type="text" id="cfg-gstin" value="${erpState.company.gstin}" required class="w-full px-3 py-2 font-mono border border-slate-300 rounded-lg">
                        </div>
                    </div>
                    <div class="flex justify-end gap-2 pt-2">
                        <button type="button" onclick="closeModal()" class="px-4 py-2 rounded-lg border border-slate-300">Cancel</button>
                        <button type="submit" class="sap-btn-primary px-4 py-2 rounded-lg font-semibold">Save Profile</button>
                    </div>
                </form>
            `;
            modal.classList.remove('hidden');
        }

        function saveCompanySettings(e) {
            e.preventDefault();
            erpState.company.name = document.getElementById('cfg-name').value.trim();
            erpState.company.code = document.getElementById('cfg-code').value.trim();
            erpState.company.gstin = document.getElementById('cfg-gstin').value.trim();
            saveState();
            closeModal();
            navigateTo(currentModule);
            showToast('Company Code profile updated.', 'success');
        }

        function openGlobalSearch() {
            const modal = document.getElementById('sap-modal');
            const content = document.getElementById('sap-modal-content');
            content.innerHTML = `
                <div class="p-4 border-b border-slate-200 flex items-center gap-3">
                    <i class="fa-solid fa-magnifying-glass text-slate-400"></i>
                    <input type="text" id="global-search-box" oninput="runGlobalSearch(this.value)" placeholder="Search Sales Orders, Materials, Production, GL Docs, Employees..." class="w-full text-sm focus:outline-none">
                    <button onclick="closeModal()" class="text-xs font-mono bg-slate-100 px-2 py-1 rounded">ESC</button>
                </div>
                <div id="global-search-results" class="p-4 max-h-96 overflow-y-auto space-y-2 text-xs">
                    <div class="text-slate-400 text-center py-6">Type any document number, customer, SKU, or employee name...</div>
                </div>
            `;
            modal.classList.remove('hidden');
            setTimeout(() => document.getElementById('global-search-box')?.focus(), 50);
        }

        function runGlobalSearch(q) {
            const query = (q || '').trim().toLowerCase();
            const box = document.getElementById('global-search-results');
            if (!box || !query) return;

            const hits = [];
            erpState.salesOrders.forEach(s => { if (s.soNumber.toLowerCase().includes(query) || s.customerName.toLowerCase().includes(query)) hits.push({ mod: 'SD', title: `${s.soNumber} — ${s.customerName}`, sub: formatINR(s.totalAmount) }); });
            erpState.materials.forEach(m => { if (m.code.toLowerCase().includes(query) || m.name.toLowerCase().includes(query)) hits.push({ mod: 'MM', title: `${m.code} — ${m.name}`, sub: `Stock: ${m.stock}` }); });
            erpState.productionOrders.forEach(p => { if (p.prodNo.toLowerCase().includes(query) || p.finishedName.toLowerCase().includes(query)) hits.push({ mod: 'PP', title: `${p.prodNo} — ${p.finishedName}`, sub: p.status }); });
            erpState.employees.forEach(e => { if (e.id.toLowerCase().includes(query) || e.name.toLowerCase().includes(query)) hits.push({ mod: 'HCM', title: `${e.id} — ${e.name}`, sub: e.role }); });

            box.innerHTML = hits.length
                ? hits.slice(0, 15).map(h => `<button onclick="closeModal(); navigateTo('${h.mod}')" class="w-full text-left p-2.5 rounded-lg hover:bg-blue-50 border border-slate-100 flex justify-between"><div><div class="font-semibold">${h.title}</div><div class="text-slate-500">${h.sub}</div></div><span class="font-mono font-bold text-blue-700">${h.mod}</span></button>`).join('')
                : `<div class="text-center text-slate-500 py-6">No matching records found.</div>`;
        }

        function exportCSV(type) {
            let rows = [];
            if (type === 'sales') {
                rows.push(['SO_Number', 'Date', 'Customer', 'Subtotal', 'GST_18', 'Total', 'Status', 'Invoice']);
                erpState.salesOrders.forEach(s => rows.push([s.soNumber, s.date, `"${s.customerName}"`, s.subtotal, s.gstAmount, s.totalAmount, s.status, s.invoiceNumber || '']));
            } else if (type === 'inventory') {
                rows.push(['SKU', 'Description', 'Type', 'Price', 'Stock', 'Valuation']);
                erpState.materials.forEach(m => rows.push([m.code, `"${m.name}"`, m.type, m.price, m.stock, m.price * m.stock]));
            } else if (type === 'ledger') {
                rows.push(['DocNo', 'Date', 'Account', 'Type', 'Debit', 'Credit', 'Text']);
                erpState.glEntries.forEach(g => rows.push([g.docNo, g.date, `"${g.account}"`, g.type, g.debit, g.credit, `"${g.text}"`]));
            }
            const uri = 'data:text/csv;charset=utf-8,' + encodeURIComponent(rows.map(r => r.join(',')).join('\n'));
            const a = document.createElement('a');
            a.href = uri;
            a.download = `SAP_${type}_${todayISO()}.csv`;
            a.click();
            showToast(`Exported SAP_${type}_${todayISO()}.csv`, 'success');
        }

        function exportFullJSONBackup() {
            const uri = 'data:application/json;charset=utf-8,' + encodeURIComponent(JSON.stringify(erpState, null, 2));
            const a = document.createElement('a');
            a.href = uri;
            a.download = `SAP_S4HANA_FULL_BACKUP_${todayISO()}.json`;
            a.click();
            showToast('Full SAP S/4HANA JSON database backup downloaded.', 'success');
        }

        function confirmResetDemo() {
            const modal = document.getElementById('sap-modal');
            const content = document.getElementById('sap-modal-content');
            content.innerHTML = `
                <div class="p-5 space-y-4">
                    <h3 class="font-bold text-base text-rose-700"><i class="fa-solid fa-triangle-exclamation mr-1.5"></i>Reset SAP S/4HANA Enterprise Database?</h3>
                    <p class="text-xs sm:text-sm text-slate-600">All custom orders, production runs, quality lots, GL entries, and logs will be restored to default sample data.</p>
                    <div class="flex justify-end gap-2">
                        <button onclick="closeModal()" class="px-4 py-2 rounded-lg border border-slate-300 text-xs font-semibold">Cancel</button>
                        <button onclick="executeResetDemo()" class="px-4 py-2 rounded-lg bg-rose-600 text-white text-xs font-semibold">Yes, Reset All</button>
                    </div>
                </div>
            `;
            modal.classList.remove('hidden');
        }

        function executeResetDemo() {
            erpState = JSON.parse(JSON.stringify(DEFAULT_ERP_DATA));
            saveState();
            closeModal();
            navigateTo('HOME');
            showToast('All 17 SAP modules reset to default enterprise data.', 'info');
        }

        function closeModal() {
            document.getElementById('sap-modal').classList.add('hidden');
        }

        document.getElementById('sap-modal').addEventListener('click', (e) => {
            if (e.target.id === 'sap-modal') closeModal();
        });

        window.addEventListener('DOMContentLoaded', () => {
            applyTheme(currentTheme);
            navigateTo('HOME');
        });
    </script>
